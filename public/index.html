<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080e20"><title>Gravity Shift Online</title><style>*{box-sizing:border-box}body{margin:0;background:#080e20;color:#f3f6ff;font:16px system-ui,Arial;overscroll-behavior:none}main{max-width:1000px;margin:auto;padding:16px}h1{font-size:clamp(25px,5vw,40px);margin:12px 0;color:#7feaff}p{color:#b8c6e3}input,button{border:1px solid #455779;border-radius:12px;padding:13px;font:inherit}input{background:#111b34;color:white;width:100%;margin:7px 0}button{background:#13b9d9;color:#041320;font-weight:800;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45}button.secondary{background:#243454;color:white}.panel{border:1px solid #2a3d61;background:#111b31;padding:18px;border-radius:18px;margin:12px 0}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.hidden{display:none!important}#game{display:block;width:100%;aspect-ratio:16/8;border:1px solid #41547b;border-radius:12px;touch-action:none;background:#0a1226}#flip{width:100%;height:70px;font-size:20px;margin-top:10px;user-select:none}#players{display:grid;gap:8px}#players div{padding:10px;border-radius:8px;background:#1c2a46}.status{min-height:25px;color:#ffcf78}.tag{font-weight:900;letter-spacing:3px;color:#ffe17e;font-size:25px}#hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:8px 0}small{color:#aebbd7}</style></head><body><main><h1>⚡ GRAVITY SHIFT ONLINE</h1><p>Corré, invertí la gravedad y sobreviví. Multijugador online de 1 a 4 personas.</p><div id="setup" class="panel"><label>Tu apodo<input id="name" maxlength="18" placeholder="Escribí tu apodo" autocomplete="nickname"></label><div class="buttons"><button id="create">Crear sala</button></div><label>Código de sala<input id="code" maxlength="5" placeholder="Ej. AB123" autocapitalize="characters"></label><button id="join" class="secondary">Unirse a sala</button></div><div id="lobby" class="panel hidden"><p>Código para compartir: <span id="roomCode" class="tag"></span></p><div class="buttons"><button id="copy" class="secondary">Copiar invitación</button></div><h3>Jugadores</h3><div id="players"></div><p id="lobbyInfo"></p><button id="start" class="hidden">Iniciar carrera</button><button id="again" class="hidden">Volver a la sala</button></div><div id="play" class="hidden"><div id="hud"><b id="score">Distancia: 0</b><b id="alive">Jugadores: 0</b></div><canvas id="game" width="960" height="450"></canvas><button id="flip">↕ INVERTIR GRAVEDAD</button><small>Tocá el juego o el botón. En PC también podés usar Espacio.</small></div><div id="result" class="panel hidden"></div><p id="status" class="status"></p></main><script>
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let ws=null,me=null,room=null,players=[],state='lobby',obstacles=[],distance=0,host=null,ranking=[];const COLORS=['#52e0ff','#ff6b9a','#ffd166','#92f48d'];function status(t){$('status').textContent=t}function connect(action){let name=$('name').value.trim(),code=$('code').value.trim().toUpperCase();if(!name)return status('Primero ingresá un apodo.');if(action==='join'&&code.length!==5)return status('Ingresá un código de 5 caracteres.');if(ws)ws.close();let proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(proto+'://'+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:action,name,code}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error')status(m.message);if(m.type==='joined'){me=m.id;room=m.code;$('setup').classList.add('hidden');$('lobby').classList.remove('hidden');$('roomCode').textContent=room;status('Conectado a la sala.')}if(m.type==='lobby'){players=m.players;host=m.host;state=m.state;renderLobby()}if(m.type==='start'){obstacles=m.obstacles;state='playing';$('lobby').classList.add('hidden');$('result').classList.add('hidden');$('play').classList.remove('hidden');status('¡Partida iniciada!')}if(m.type==='tick'){distance=m.distance;for(let p of m.players){let local=players.find(x=>x.id===p.id);if(local)Object.assign(local,p)}$('score').textContent='Distancia: '+Math.floor(distance/10);$('alive').textContent='Vivos: '+players.filter(p=>p.alive).length}if(m.type==='ended'){state='ended';ranking=m.ranking;$('result').classList.remove('hidden');$('result').innerHTML='<h2>🏆 Resultados</h2>'+ranking.map((p,i)=>'<p style="color:'+p.color+'">'+(i+1)+'. '+escapeHtml(p.name)+' — '+p.score+' puntos</p>').join('');$('lobby').classList.remove('hidden');renderLobby()}};ws.onclose=()=>status('Conexión cerrada. Recargá para volver a entrar.');ws.onerror=()=>status('No se pudo conectar al servidor. Abrí el juego desde la URL donde esté alojado.')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderLobby(){$('players').innerHTML=players.map(p=>'<div style="border-left:5px solid '+p.color+'">'+escapeHtml(p.name)+(p.id===host?' 👑':'')+'</div>').join('');$('lobbyInfo').textContent=state==='lobby'?'Esperando jugadores. El anfitrión puede iniciar la partida.':state==='ended'?'Partida finalizada. El anfitrión puede abrir otra ronda.':'Carrera en curso';$('start').classList.toggle('hidden',!(me===host&&state==='lobby'));$('again').classList.toggle('hidden',!(me===host&&state==='ended'))}function send(type){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type}))}$('create').onclick=()=>connect('create');$('join').onclick=()=>connect('join');$('start').onclick=()=>send('start');$('again').onclick=()=>send('again');$('copy').onclick=async()=>{let url=new URL(location.href);url.searchParams.set('room',room);let msg='Unite a mi sala de Gravity Shift: '+url.toString()+' (código '+room+')';try{await navigator.clipboard.writeText(msg);status('Invitación copiada.')}catch{status('Compartí este enlace: '+url.toString())}};let params=new URLSearchParams(location.search);if(params.has('room'))$('code').value=params.get('room').toUpperCase();function flip(){if(state==='playing')send('flip')}$('flip').addEventListener('pointerdown',e=>{e.preventDefault();flip()});canvas.addEventListener('pointerdown',e=>{e.preventDefault();flip()});window.addEventListener('keydown',e=>{if(e.code==='Space'&&state==='playing'){e.preventDefault();if(!e.repeat)flip()}});
function draw(){requestAnimationFrame(draw);let w=960,h=450;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0b1730';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#20395c';ctx.lineWidth=1;for(let x=-(distance*.3%60);x<w;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}ctx.fillStyle='#3a5679';ctx.fillRect(0,0,w,8);ctx.fillRect(0,h-8,w,8);for(let o of obstacles){let x=o.x-distance;if(x>w+30)break;if(x+o.w<0)continue;ctx.fillStyle=o.kind==='spike'?'#ff537a':'#8a96bb';ctx.fillRect(x,o.y,o.w,o.h);if(o.kind==='spike'){ctx.fillStyle='#ffbdc9';for(let yy=o.y+4;yy<o.y+o.h;yy+=19){ctx.beginPath();ctx.moveTo(x+3,yy);ctx.lineTo(x+o.w/2,yy+8);ctx.lineTo(x+3,yy+16);ctx.fill()}}else{ctx.strokeStyle='#c9d3ed';ctx.strokeRect(x+3,o.y+3,o.w-6,o.h-6)}}players.forEach((p,i)=>{let y=Number.isFinite(p.y)?p.y:427;let x=140+(i%4)*3;ctx.globalAlpha=p.alive===false?.3:1;ctx.fillStyle=p.color||COLORS[i];ctx.fillRect(x,y,23,23);ctx.fillStyle='#061323';ctx.fillRect(x+15,y+5,4,4);ctx.globalAlpha=1;ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(p.name,x+12,Math.max(24,y-8))});if(state==='ended'){ctx.fillStyle='#0008';ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 40px system-ui';ctx.fillText('FIN DE LA CARRERA',w/2,h/2)}}draw();
</script></body></html>
